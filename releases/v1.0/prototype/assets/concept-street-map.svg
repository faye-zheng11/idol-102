    <path d="M120 -70 C195 270 238 516 218 810 S174 1138 252 1460" fill="none" stroke="#242a34" stroke-width="34"/>
    <path d="M718 -70 C655 230 650 500 718 770 S806 1132 705 1460" fill="none" stroke="#242a34" stroke-width="34"/>
  </g>

