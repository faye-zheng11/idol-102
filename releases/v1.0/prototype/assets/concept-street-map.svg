<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-label="Night street map concept">
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset=".45" stop-color="#141820"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d222b"/>
      <stop offset=".55" stop-color="#10131a"/>
      <stop offset="1" stop-color="#252016"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="62%" cy="27%" r="44%">
      <stop offset="0" stop-color="#d5b071" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#7f6a45" stop-opacity=".12"/>
      <stop offset="1" stop-color="#08090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="26%" cy="18%" r="38%">
      <stop offset="0" stop-color="#8fb8ca" stop-opacity=".28"/>
      <stop offset="1" stop-color="#08090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="lamp" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="1400" fill="url(#sky)"/>
  <rect width="900" height="1400" fill="url(#goldGlow)"/>
  <rect width="900" height="1400" fill="url(#blueGlow)"/>

