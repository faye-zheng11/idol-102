<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idol 102 · Web Snapshots</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #fff9ff;
        background:
          radial-gradient(circle at 16% 4%, rgba(255, 138, 174, .16), transparent 28%),
          radial-gradient(circle at 84% 6%, rgba(112, 231, 255, .13), transparent 28%),
          linear-gradient(135deg, #2d1426 0%, #181a25 48%, #071821 100%);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 1480px;
        padding: 48px;
      }
      h1 {
        margin: 0;
        font-size: 52px;
        line-height: 1;
      }
      p {
        margin: 14px 0 34px;
        color: rgba(255, 249, 255, .68);
        font-size: 18px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 26px;
      }
      figure {
        margin: 0;
        display: grid;
        gap: 12px;
      }
      img {
        width: 100%;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 24px;
        box-shadow: 0 28px 80px rgba(0,0,0,.44);
        background: #08070d;
      }
      figcaption {
        display: grid;
        gap: 5px;
        min-height: 54px;
      }
      b {
        font-size: 15px;
      }
      span {
        color: #f6cf8b;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <span>Idol 102 Live Prototype</span>
      <h1>网页快照截图板</h1>
      <p>这些图来自本地网页实际运行状态，可直接拖进 Figma，或把本页作为开发沟通截图板。</p>
      <section class="grid">
        <figure><img src="01-splash-login.png" alt="Splash login" /><figcaption><span>01</span><b>Splash / Login</b></figcaption></figure>
        <figure><img src="02-member-select.png" alt="Member select" /><figcaption><span>02</span><b>Member Select</b></figcaption></figure>
        <figure><img src="03-dream-intro.png" alt="Dream intro" /><figcaption><span>03</span><b>Dream Intro</b></figcaption></figure>
        <figure><img src="04-ob-dream-chat-opening.png" alt="OB dream chat opening" /><figcaption><span>04</span><b>OB Dream Chat · Opening</b></figcaption></figure>
        <figure><img src="05-ob-dream-chat-final-choice.png" alt="OB dream chat final choice" /><figcaption><span>05</span><b>OB Dream Chat · Later State</b></figcaption></figure>
        <figure><img src="06-dream-error-reload.png" alt="Dream error reload" /><figcaption><span>06</span><b>Dream Error / Reload</b></figcaption></figure>
        <figure><img src="10-home-relationship.png" alt="Home relationship" /><figcaption><span>07</span><b>Home / Relationship</b></figcaption></figure>
        <figure><img src="11-chat.png" alt="Chat" /><figcaption><span>08</span><b>Chat</b></figcaption></figure>
        <figure><img src="12-scene-list.png" alt="Scene list" /><figcaption><span>09</span><b>Scene List</b></figcaption></figure>
        <figure><img src="13-me-profile.png" alt="Me profile" /><figcaption><span>10</span><b>Me / Profile</b></figcaption></figure>
      </section>
    </main>
  </body>
</html>
