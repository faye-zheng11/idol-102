      .body{fill:#a99aa8;font:400 18px Inter,Arial,sans-serif}
      .small{fill:#a99aa8;font:400 12px Inter,Arial,sans-serif}
      .phoneTitle{fill:#fff9ff;font:800 16px Inter,Arial,sans-serif}
