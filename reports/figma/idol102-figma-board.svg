      <stop offset="1" stop-color="#b98545"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#151824"/>
      <stop offset=".58" stop-color="#08070d"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx=".25" cy=".1" r=".65">
      <stop offset="0" stop-color="#ff8aae" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#b897ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#08070d" stop-opacity="0"/>
