  <g id="phone02" transform="translate(330 560)" filter="url(#shadow)">
    <rect width="234" height="506" rx="22" fill="#08070d" stroke="rgba(255,255,255,.22)"/>
    <rect width="234" height="506" rx="22" fill="#ff8aae" opacity=".12"/>
