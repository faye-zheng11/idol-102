<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 356" role="img" aria-label="Style 01 Midnight Fanlight UI reference">
  <defs>
    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#281424"/>
      <stop offset=".54" stop-color="#1f202a"/>
      <stop offset="1" stop-color="#0d1c23"/>
    </linearGradient>
    <linearGradient id="heroPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3b2437" stop-opacity=".74"/>
      <stop offset=".56" stop-color="#2a2734" stop-opacity=".72"/>
      <stop offset="1" stop-color="#151c24" stop-opacity=".74"/>
    </linearGradient>
    <linearGradient id="infoPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2734" stop-opacity=".76"/>
      <stop offset="1" stop-color="#10202a" stop-opacity=".76"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#05070b" flood-opacity=".38"/>
    </filter>
    <style>
      .label { font: 800 20px Inter, PingFang SC, Arial, sans-serif; letter-spacing: 6px; }
      .title { font: 800 43px Inter, PingFang SC, Arial, sans-serif; }
      .body { font: 700 25px Inter, PingFang SC, Arial, sans-serif; fill: #beb4c7; }
      .card-title { font: 800 22px Inter, PingFang SC, Arial, sans-serif; fill: #f4eef8; }
      .card-copy { font: 700 19px Inter, PingFang SC, Arial, sans-serif; fill: #aaa4b4; }
    </style>
  </defs>

  <rect width="2048" height="356" fill="url(#pageBg)"/>
  <rect x="0" y="6" width="1115" height="350" rx="8" fill="url(#heroPanel)" stroke="#ffffff" stroke-opacity=".17" filter="url(#shadow)"/>
  <rect x="1143" y="6" width="905" height="350" rx="8" fill="url(#infoPanel)" stroke="#ffffff" stroke-opacity=".17" filter="url(#shadow)"/>

  <text x="25" y="51" class="label" fill="#70e7ff">STYLE 01</text>
  <text x="25" y="105" class="title" fill="#fff9ff">Midnight Fanlight</text>
  <text x="25" y="156" class="body">以欧洲夜场演唱会、应援灯海和私信暧昧感为核心。画面是深夜紫黑底、粉蓝霓虹作为情绪信号，适合</text>
  <text x="25" y="196" class="body">主推年轻、强互动、轻恋爱幻想的版本。</text>

  <g>
    <rect x="1171" y="34" width="422" height="162" rx="10" fill="#171c25" fill-opacity=".62" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="1187" y="68" class="card-title">颜色</text>
    <text x="1187" y="101" class="card-copy">#090914 背景，#FF6FB7 主按钮，#70E7FF 高</text>
    <text x="1187" y="128" class="card-copy">亮，#B897FF 稀有/梦境。</text>
    <rect x="1187" y="143" width="37" height="37" rx="7" fill="#090914" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="1233" y="143" width="37" height="37" rx="7" fill="#ff6fb7"/>
    <rect x="1281" y="143" width="37" height="37" rx="7" fill="#70e7ff"/>
    <rect x="1329" y="143" width="37" height="37" rx="7" fill="#b897ff"/>
  </g>

  <g>
    <rect x="1609" y="34" width="422" height="162" rx="10" fill="#171c25" fill-opacity=".62" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="1625" y="68" class="card-title">字体字号</text>
    <text x="1625" y="101" class="card-copy">Inter/SF/PingFang；H1 34，页标题 18，正文</text>
    <text x="1625" y="128" class="card-copy">13，注释 11；字重 750-850。</text>
  </g>

  <g>
    <rect x="1171" y="212" width="422" height="122" rx="10" fill="#171c25" fill-opacity=".62" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="1187" y="247" class="card-title">边框阴影</text>
    <text x="1187" y="280" class="card-copy">8px 组件圆角，手机 26px；1px 白 14% 描边；</text>
    <text x="1187" y="307" class="card-copy">粉蓝 glow 表示亲密/可点击。</text>
  </g>

  <g>
    <rect x="1609" y="212" width="422" height="122" rx="10" fill="#171c25" fill-opacity=".62" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="1625" y="247" class="card-title">组件</text>
    <text x="1625" y="280" class="card-copy">霓虹胶囊标签、半透明聊天气泡、发光选择题、建</text>
    <text x="1625" y="307" class="card-copy">筑地点浮框、回忆宝丽来卡。</text>
  </g>
</svg>
